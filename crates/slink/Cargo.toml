[package]
name = "slink"
description = "The slink CLI, recorder and local viewer server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Built as slink-rs until it replaces the Go CLI (docs/rust-migration.md, P5).
[[bin]]
name = "slink-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
# Local days and clock times on the sessions page.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# rustls with the operating system's trust store, as Go's client used; the
# crypto provider is ring, installed in src/tls.rs.
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
# Operating-system randomness, from the provider TLS already links.
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
slink-format = { path = "../slink-format" }
slink-import = { path = "../slink-import" }
slink-local = { path = "../slink-local" }
slink-protocol = { path = "../slink-protocol" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
