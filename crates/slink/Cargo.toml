[package]
name = "slink"
description = "The slink CLI, recorder and local viewer server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Built as slink-rs until it replaces the Go CLI (docs/rust-migration.md, P5).
[[bin]]
name = "slink-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# rustls with the operating system's trust store, as Go's client used; the
# crypto provider is ring, installed in src/tls.rs.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
