[package]
name = "slink-format"
description = "session/v0 validation and the credential scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Draft 2020-12 validation, from the author of the library the Go CLI uses.
boon = "0.6"
# The credential patterns need ASCII matching only; boon turns the Unicode
# tables on for the build as a whole.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = "1"
# Without float_roundtrip serde_json reads some numbers one step away from
# the nearest double, and a document would not be written back as it was read.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
