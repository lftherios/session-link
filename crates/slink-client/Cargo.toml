[package]
name = "slink-client"
description = "The hosted service as the slink CLI reaches it: sign-in, encrypted publishing, deleting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A pending receipt keeps its envelope as Go's encoding/json writes bytes.
base64 = "0.22"
# The client the CLI already builds: rustls with the operating system's trust
# store, ring as the crypto provider (docs/rust-build.md).
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
# A content key and an envelope's nonce, from the operating system.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
slink-format = { path = "../slink-format" }
slink-local = { path = "../slink-local" }
slink-protocol = { path = "../slink-protocol" }
# Waiting between polls while a person signs in; one device action at a time.
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
