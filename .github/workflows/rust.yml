name: rust

# The Rust port (docs/rust-build.md): lint once, then build, test and run the
# release binary natively on each of the six distribution targets, and compare
# the format validators and the protocol verifiers across languages. It also
# runs on the port's own branches, which reach main without a pull request.
on:
  push:
    branches: [main, "feature/rust-**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Built once and handed to every other job, so no target needs Node.
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: build/viewer
          if-no-files-found: error

  lint:
    needs: viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer
          path: build/viewer
      # Reads rust-toolchain.toml. An empty rustflags keeps the action from
      # overriding the per-target flags in .cargo/config.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The JavaScript, Go and Rust validators and credential scanners on the same
  # texts (docs/rust-format.md): the shared cases in each language's tests,
  # then the sweep for differences no case names.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: npm ci
      - run: node --test test/format-cases.test.mjs
      - run: cd go && go test ./internal/format ./internal/scan
      - run: cargo test --locked -p slink-format
      - run: node scripts/format-diff.mjs

  # The Go CLI, the viewer and the Rust crate on the same envelopes, signed
  # statements, device histories and vault records (docs/rust-protocol.md):
  # the case files are what their generator writes, each language's tests
  # read them, then the sweep looks for differences no case names.
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: npm ci
      - run: node scripts/protocol-cases.mjs --check
      - run: node --test test/protocol-cases.test.mjs
      - run: cd go && go test -count=1 ./internal/sealed ./internal/identity
      - run: cargo test --locked -p slink-protocol
      - run: node scripts/protocol-diff.mjs

  build:
    needs: viewer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # A test that waits for ever must not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer
          path: build/viewer
      # The C compiler for the bundled SQLite and ring on a musl target.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      # Every failure on a target in one run, not the first test binary's.
      - run: cargo test --locked --no-fail-fast --target ${{ matrix.target }}
      # The one test that reaches the network: this machine's trust store
      # verifies the hosted service.
      - run: cargo test --locked --target ${{ matrix.target }} --test tls -- --ignored
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the release binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/slink-rs${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$bin" build-check
          ls -l "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: slink-rs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/slink-rs${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
