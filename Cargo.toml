[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Releases stamp the binary through SLINK_VERSION, as goreleaser stamped Go.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lftherios/session-link"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Panics unwind: a panic while handling one proxied request must not take the
# always-on recorder down with it.
